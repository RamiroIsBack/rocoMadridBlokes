    <meta name="theme-color" content="#1a1714" />
    <!-- Ramiro, 13/11: 2 modos (claro/oscuro, sin automático) — se fija el data-theme aquí,
         antes del CSS, para que no haya parpadeo claro al cargar en quien tiene oscuro
         guardado (o no ha elegido nunca: por defecto oscuro, igual que hasta ahora). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('blokes_tema')
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
